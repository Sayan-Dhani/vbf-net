[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vbfnet-ensemble"
version = "5.0.0"
description = "Fold-routed k-fold VBF-Net GNN regressors (member = event % K) for HH->bbtautau VBF: quark four-vectors (p4) and mjj, deta, eta_prod, ptsum (hl)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "uproot>=5.0",
    "awkward>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
calibration = ["correctionlib>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["vbfnet_ensemble"]

[tool.setuptools.package-data]
vbfnet_ensemble = ["py.typed"]
